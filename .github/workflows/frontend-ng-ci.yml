name: frontend-ng-ci

on:
  pull_request:
    paths:
      - "frontend-ng/data-engine/**"
      - ".github/workflows/frontend-ng-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend-ng/data-engine/**"
      - ".github/workflows/frontend-ng-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-ng:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ng/data-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-ng/data-engine/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --watch=false
      - run: npm run lint
      - run: npm run format:check

  tauri-build:
    name: tauri-build-${{ matrix.platform }}
    needs: frontend-ng
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: tauri-linux
            artifact_glob: |
              frontend-ng/data-engine/src-tauri/target/release/bundle/**/*.AppImage
              frontend-ng/data-engine/src-tauri/target/release/bundle/**/*.deb
          - platform: macos-latest
            artifact_name: tauri-macos
            artifact_glob: |
              frontend-ng/data-engine/src-tauri/target/release/bundle/**/*.dmg
              frontend-ng/data-engine/src-tauri/target/release/bundle/**/*.app.tar.gz
          - platform: windows-latest
            artifact_name: tauri-windows
            artifact_glob: |
              frontend-ng/data-engine/src-tauri/target/release/bundle/**/*.msi
              frontend-ng/data-engine/src-tauri/target/release/bundle/**/*.exe

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend-ng/data-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-ng/data-engine/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri deps (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci
      - run: npm run tauri:build

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  publish-release:
    needs: tauri-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Release
          name: Rolling Release (main)
          prerelease: true
          make_latest: false
          files: release-artifacts/**/*
          generate_release_notes: false
          body: |
            Rolling prerelease from `main`.
            Commit: ${{ github.sha }}
