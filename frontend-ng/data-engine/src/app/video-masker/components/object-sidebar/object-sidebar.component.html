<div class="section">
  <h3>Objects</h3>
  <div class="object-list">
    <div *ngFor="let obj of store.objectPointGroups()" class="object-family">
      <div
        *ngIf="store.selectedObjectId() === obj.id; else unselectedObject"
        class="object-item selected"
      >
        <span class="color-indicator" [style.background-color]="obj.color"></span>
        <input
          #objectLabel
          type="text"
          class="object-name-input"
          aria-label="Object label"
          [value]="obj.name"
          maxlength="200"
          [disabled]="store.isInteractionBusy()"
          (change)="renameObject(obj.id, objectLabel)"
          (keydown.enter)="objectLabel.blur()"
        />
        <small>{{ obj.children.length }} points</small>
      </div>
      <ng-template #unselectedObject>
        <button
          type="button"
          class="object-item"
          [disabled]="store.isInteractionBusy()"
          (click)="store.selectedObjectId.set(obj.id)"
          aria-pressed="false"
        >
          <span class="color-indicator" [style.background-color]="obj.color"></span>
          <span>{{ obj.name }}</span>
          <small>{{ obj.children.length }} points</small>
        </button>
      </ng-template>
      <div class="object-children" *ngIf="store.selectedObjectId() === obj.id">
        <p *ngIf="!obj.children.length" class="point-empty">
          Click the canvas to add child points.
        </p>
        <ul class="child-point-list" aria-label="Child points">
          <li *ngFor="let point of obj.children">
            <button
              type="button"
              class="point-show"
              [disabled]="store.isInteractionBusy()"
              [class.current-frame]="store.displayedFrameIdx() === point.frameIdx"
              (click)="showObjectPoint(obj.id, point.frameIdx)"
            >
              <span
                >{{ point.label === 1 ? 'Positive' : 'Negative' }} point {{ point.number }}</span
              >
              <small
                >Frame {{ point.frameIdx }} · ({{ point.x | number: '1.0-1' }},
                {{ point.y | number: '1.0-1' }})</small
              >
            </button>
            <button
              type="button"
              class="point-remove"
              [disabled]="store.isInteractionBusy()"
              [attr.aria-label]="'Remove point ' + point.number + ' on frame ' + point.frameIdx"
              title="Remove point"
              (click)="removePoint(obj.id, point.frameIdx, point.number)"
            >
              ×
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="button-group">
    <button (click)="objects.addObject()" [disabled]="store.isInteractionBusy()">Add Object</button>
    <button
      (click)="objects.removeObject()"
      [disabled]="store.isInteractionBusy() || store.selectedObjectId() === null"
    >
      Remove
    </button>
    <button
      (click)="objects.removeAllObjects()"
      [disabled]="store.isInteractionBusy() || store.objects().length === 0"
    >
      Remove All Objects
    </button>
  </div>
</div>
